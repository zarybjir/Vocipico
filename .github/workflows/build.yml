# Sestavení APK na GitHubu.
#
# Podepisování (aby šly aktualizace instalovat přes starou verzi) — dva secrets
# v Settings > Secrets and variables > Actions:
#   PMT_KEYSTORE_B64       klíč release.p12 zakódovaný v base64
#   PMT_KEYSTORE_PASSWORD  heslo ke klíči
# S nimi vznikne podepsaná app-release.apk. Bez nich jen debug APK
# s náhodným klíčem (aktualizace přes ni nepůjdou).
#
# Tag "v1.0.1" navíc vytvoří GitHub Release s APK — z toho umí aktualizovat Obtainium.
name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.PMT_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "PMT_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          PMT_KEYSTORE_PASSWORD: ${{ secrets.PMT_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          # Bez klíče: debug APK + kontrolní (nepodepsaný) release build,
          # ať se chyby release buildu ukážou hned.
          TASKS="assembleDebug assembleRelease"
          if [ -n "${PMT_KEYSTORE:-}" ] && [ -n "${PMT_KEYSTORE_PASSWORD:-}" ]; then TASKS="assembleRelease"; fi
          set +e
          ./gradlew --no-daemon --console=plain $TASKS > build.log 2>&1
          rc=$?
          set -e
          cat build.log
          if [ $rc -ne 0 ]; then
            # Skutečnou chybu ukázat jako anotaci, ať je vidět bez otevírání logu.
            msg=$(grep -E "^e: |error:|What went wrong|Could not|> |FAILURE|Caused by" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
            exit $rc
          fi
          rm -f app/build/outputs/apk/release/*-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: precti-mi-to-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
